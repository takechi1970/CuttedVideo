<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#4f46e5" stroke-width="6" stroke-opacity="0.4" />

  <!-- Subtle Film Perforations -->
  <g fill="#ffffff" fill-opacity="0.12">
    <rect x="76" y="70" width="28" height="20" rx="4" />
    <rect x="140" y="70" width="28" height="20" rx="4" />
    <rect x="204" y="70" width="28" height="20" rx="4" />
    <rect x="280" y="70" width="28" height="20" rx="4" />
    <rect x="344" y="70" width="28" height="20" rx="4" />
    <rect x="408" y="70" width="28" height="20" rx="4" />

    <rect x="76" y="422" width="28" height="20" rx="4" />
    <rect x="140" y="422" width="28" height="20" rx="4" />
    <rect x="204" y="422" width="28" height="20" rx="4" />
    <rect x="280" y="422" width="28" height="20" rx="4" />
    <rect x="344" y="422" width="28" height="20" rx="4" />
    <rect x="408" y="422" width="28" height="20" rx="4" />
  </g>

  <!-- Film Frame Outer Box -->
  <rect x="68" y="112" width="376" height="288" rx="32" fill="#0f172a" fill-opacity="0.75" stroke="#312e81" stroke-width="8" />

  <!-- Neon Vertical Split Line (Precision Cut) -->
  <line x1="256" y1="112" x2="256" y2="400" stroke="#38bdf8" stroke-width="6" stroke-dasharray="14 10" filter="url(#glow)" />

  <!-- Precision Cutting Blades / Scissors Icon -->
  <g transform="translate(136, 136) scale(10)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Top Ring & Blade -->
    <circle cx="6" cy="6" r="3" stroke="url(#bladeGrad1)" stroke-width="2" />
    <path d="M8.5 7.5 L19 18" stroke="url(#bladeGrad1)" stroke-width="2.2" />

    <!-- Bottom Ring & Blade -->
    <circle cx="6" cy="18" r="3" stroke="url(#bladeGrad2)" stroke-width="2" />
    <path d="M8.5 16.5 L19 6" stroke="url(#bladeGrad2)" stroke-width="2.2" />

    <!-- Center Hinge Pivot -->
    <circle cx="12" cy="12" r="1.3" fill="#ffffff" stroke="#38bdf8" stroke-width="1" />
  </g>
</svg>
